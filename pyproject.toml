[project]
name = "comfyui-h3-long-video"
description = "Generate long MiniMax H3 videos from one prompt and a total duration. Segments are sampled with motion and audio continuation and joined into one video, with optional LLM prompt splitting, a Ref2VA prompt builder and the clip-chaining nodes. Based on NikoDemon80/ComfyUI-H3-Motion-Context."
version = "0.7.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NikoDemon80", email = "262659861+NikoDemon80@users.noreply.github.com" },
    { name = "ooizj", email = "9606965+ooizj@users.noreply.github.com" },
]
keywords = ["comfyui", "minimax-h3", "video-generation", "audio", "clip-chaining", "video-continuation", "long-video"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/ooizj/ComfyUI-H3-Long-Video"
Repository = "https://github.com/ooizj/ComfyUI-H3-Long-Video"
Issues = "https://github.com/ooizj/ComfyUI-H3-Long-Video/issues"

[tool.comfy]
PublisherId = "misaka"
DisplayName = "H3 Long Video"
